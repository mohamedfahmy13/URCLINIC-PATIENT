name: kivicare_patient
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.9.7+8


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  #Commons
  nb_utils: ^7.1.8
  google_fonts: ^6.3.2
  html: ^0.15.6
  http: ^1.6.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  flutter_vector_icons: ^2.0.0
  lottie: ^3.3.2
  flutter_svg: ^2.2.3
  flutter_svg_provider: ^1.0.7
  stream_transform: ^2.1.1
  flutter_local_notifications: ^19.5.0
  app_badge_plus: ^1.1.2
  carousel_slider: ^5.1.1
  responsive_navigation_bar: ^6.1.0
  date_picker_timeline: ^1.2.7
  playx_version_update: ^1.0.1
  video_player: ^2.9.2

  #firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4

  # SOCIAL LOGIN
  the_apple_sign_in: ^1.1.1
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  permission_handler: ^12.0.0+1

  # State Management
  get: ^4.7.2
  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  get_it: ^9.2.0
  dio: ^5.8.0+1
  dartz: ^0.10.1

  #Storage
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1

  #PhotoViewGallery
  photo_view: ^0.15.0

  #Pickers
  file_picker: ^10.3.7
  image_picker: ^1.2.1
  country_picker: ^2.0.27

  # Google Map
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Payment - Disabled (Cash only)
  # flutter_stripe: ^12.1.1
  # phonepe_payment_sdk: ^2.0.3
  # flutterwave_standard
  # flutter_paypal_checkout
  # cinetpay
  # flutter_paystack
  # midpay
  flutter_localizations:
    sdk: flutter
  percent_indicator: ^4.2.5

  uuid: any
  crypto: any
  path_provider: any
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0
  phone_numbers_parser: ^9.0.21
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/n_logo.jpeg"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/n_logo.jpeg"


# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/
    - assets/flags/
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/icons/navigation/
    - assets/icons/social_media/
